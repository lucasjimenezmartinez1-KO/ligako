name: Puntos en directo

on:
  schedule:
    # Sábados y madrugada del domingo (UTC), cada 5 minutos: cubre eventos en Europa, Oriente Medio y América
    - cron: '*/5 12-23 * * 6'
    - cron: '*/5 0-7 * * 0'
    # Domingo: bonos de la noche y cierre del evento
    - cron: '20 8-23 * * 0'
    # Entre semana: cierre de mercados y cambios de cartelera cada 3 horas
    - cron: '40 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar lectura aunque no haya empezado (1)'
        required: false
        default: ''
      dry:
        description: 'Prueba sin escribir nada (1)'
        required: false
        default: ''
      minutes:
        description: 'Seguir leyendo cada minuto durante estos minutos (máx. 350)'
        required: false
        default: ''

concurrency:
  group: live-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'cron' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Leer resultados (durante el evento, cada minuto)
        run: |
          rm -f /tmp/notlive; ok=0
          # Programado: durante el evento sigue leyendo cada minuto hasta 340 min (fuera del evento termina enseguida)
          n=340; [ -n "${{ github.event.inputs.minutes }}" ] && n=${{ github.event.inputs.minutes }}
          end=$(( $(date +%s) + n * 60 ))
          while :; do
            if timeout 150 node scripts/live.js; then ok=1; fi
            [ -f /tmp/notlive ] && break
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ github.event.inputs.minutes }}" ] && break
            [ $(date +%s) -ge $end ] && break
            sleep 45
          done
          [ $ok = 1 ]
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || vars.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ github.event.inputs.force }}
          DRY: ${{ github.event.inputs.dry }}
          LOOP_FLAG: /tmp/notlive
          NEW_EVENT_FLAG: /tmp/new_event
      - name: Relevo (si el evento sigue en marcha, lanza otra lectura continua)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/notlive ] && { [ "${{ github.event_name }}" = "schedule" ] || [ -n "${{ github.event.inputs.minutes }}" ]; }; then
            # Solo si no hay ya otra lectura continua en marcha (para no duplicarlas)
            others=$(gh api "repos/${{ github.repository }}/actions/workflows/live.yml/runs?status=in_progress&event=workflow_dispatch&per_page=20" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
            if [ "$others" = "0" ]; then gh workflow run live.yml --repo ${{ github.repository }} -f minutes=340 && echo "::notice::Evento en marcha: lanzada otra lectura continua"; fi
          fi
      - name: Fotos de la nueva cartelera
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/new_event ]; then gh workflow run photos.yml --repo ${{ github.repository }} && echo "::notice::Nueva cartelera $(cat /tmp/new_event): buscando fotos"; fi
