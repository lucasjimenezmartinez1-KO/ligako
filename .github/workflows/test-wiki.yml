name: Prueba wiki
on:
  workflow_dispatch:
    inputs:
      t:
        description: 'Página'
        required: false
        default: 'Alexander Volkanovski'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-wiki.js "${{ github.event.inputs.t }}"
      - name: Probar conexión a la base de datos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "::notice::longitud=${#DB} empieza=$(echo "$DB" | cut -c1-24) usuario=$(echo "$DB" | sed -E 's#^[a-z]+://([^:]+):.*#\1#') servidor=$(echo "$DB" | sed -E 's#.*@([^/?]+).*#\1#') corchetes=$(echo "$DB" | grep -c '\[')"
          out=$(psql "$DB" -c "select 1" 2>&1) && echo "::notice::conexión OK" || echo "::notice::error: $(echo "$out" | tr '\n' ' ')"
