name: Prueba ESPN (sin base de datos)

on:
  workflow_dispatch:
    inputs:
      range:
        description: 'Fechas YYYYMMDD-YYYYMMDD (vacío = últimos 40 días)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-espn.js ${{ github.event.inputs.range }}
