name: Fotos de luchadores

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev && npm i --no-save sharp@0.33.5
      - run: node scripts/photos.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || vars.SUPABASE_SERVICE_KEY }}
      - name: Guardar las fotos
        run: |
          git add public/fighters public/cards public/hero
          if git diff --cached --quiet; then echo "::notice::No hay fotos nuevas"; exit 0; fi
          git -c user.name="Liga KO" -c user.email="actions@users.noreply.github.com" commit -qm "Fotos de luchadores (Wikimedia Commons)"
          git push
