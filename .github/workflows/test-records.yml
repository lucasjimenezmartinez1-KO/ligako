name: Prueba récords

on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Nombres separados por comas'
        required: false
        default: ''
      script:
        description: 'Script'
        required: false
        default: 'test-records.js'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - run: node scripts/${{ github.event.inputs.script || 'test-records.js' }} "${{ github.event.inputs.names }}"
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
